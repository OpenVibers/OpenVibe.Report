## ═══════════════════════════════════════════════════════════════
## openvibe.report — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.report.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5080, systemd unit openvibe-report) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits the API, and compresses text.
##
## No proxy_cache: the app decides cacheability per response (public for two minutes on pages and API, an hour on
## the crawl artifacts, immutable only for a content-addressed asset). The API is GET-only.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=report_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.report www.openvibe.report;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.report$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.report;

    ssl_certificate     /etc/letsencrypt/live/openvibe.report/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.report/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.report$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.report;

    ssl_certificate     /etc/letsencrypt/live/openvibe.report/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.report/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.report.access.log;
    error_log  /var/log/nginx/openvibe.report.error.log;

    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API: GET and HEAD only, with the app's 120/min limit backed by a coarse nginx one ──
    location /api/ {
        add_header Allow "GET, HEAD" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=report_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5080;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5080/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── Internal delivery is loopback-only (Events, shadow); refuse it from outside ──
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, crawl artifacts, static assets, release metadata ──
    location / {
        proxy_pass http://127.0.0.1:5080;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
